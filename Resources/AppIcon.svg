<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Daisy app icon. Source of truth: render with ./make-icon.sh. No filters (NSImage's SVG renderer ignores them). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC233"/>
      <stop offset="1" stop-color="#FF5A0A"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFE9D2"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="0.5" stop-color="#FF9A1A"/>
      <stop offset="1" stop-color="#E9500A"/>
    </radialGradient>
    <path id="p" d="M -16 -112 C -44 -180 -66 -262 -52 -312 A 52 52 0 0 1 52 -312 C 66 -262 44 -180 16 -112 Z"/>
    <g id="flower">
      <use href="#p" transform="rotate(0)"/>
      <use href="#p" transform="rotate(30)"/>
      <use href="#p" transform="rotate(60)"/>
      <use href="#p" transform="rotate(90)"/>
      <use href="#p" transform="rotate(120)"/>
      <use href="#p" transform="rotate(150)"/>
      <use href="#p" transform="rotate(180)"/>
      <use href="#p" transform="rotate(210)"/>
      <use href="#p" transform="rotate(240)"/>
      <use href="#p" transform="rotate(270)"/>
      <use href="#p" transform="rotate(300)"/>
      <use href="#p" transform="rotate(330)"/>
    </g>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>

  <!-- flower shadow -->
  <g transform="translate(512 528) scale(0.94)" fill="#B83A00" fill-opacity="0.22">
    <use href="#flower"/>
    <circle r="132"/>
  </g>
  <!-- petals -->
  <g transform="translate(512 512) scale(0.94)" fill="url(#petal)">
    <use href="#flower"/>
  </g>
  <!-- hub -->
  <circle cx="512" cy="512" r="132" fill="url(#hub)"/>
  <circle cx="512" cy="512" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4"/>
  <ellipse cx="478" cy="462" rx="58" ry="34" fill="#FFFFFF" fill-opacity="0.28" transform="rotate(-25 478 462)"/>
</svg>
